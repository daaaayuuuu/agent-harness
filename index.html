<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Agent Blueprint｜17 篇组件文档</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2320252c'/%3E%3Cpath d='M18 19h28v26H18zM25 13h14M25 51h14M12 26v12M52 26v12' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
:root {
  color-scheme: light;
  --accent: #2864dc;
  --accent-soft: #eaf1ff;
  --bg: #ffffff;
  --sidebar-bg: #f7f8fa;
  --border: #e4e7ec;
  --border-strong: #d5dae2;
  --text: #20252c;
  --text-muted: #6b7280;
  --code-bg: #111827;
  --code-text: #e5e7eb;
  --sidebar-width: 312px;
  --topbar-height: 58px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  width: 100%;
  height: 100%;
}

.sidebar {
  position: relative;
  z-index: 20;
  display: flex;
  min-height: 0;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--sidebar-bg);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 78px;
  padding: 18px 22px 16px;
}

.brand-mark {
  display: grid;
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 11px;
  background: var(--text);
  color: white;
}

.brand-mark svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.7;
}

.brand-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.brand-subtitle {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 12px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 40px;
  margin: 4px 16px 18px;
  padding: 0 11px;
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  background: white;
  color: #8a919e;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}

.search-box:focus-within {
  border-color: #9ebbf2;
  box-shadow: 0 0 0 3px rgba(40, 100, 220, 0.1);
}

.search-box svg,
.text-button svg,
.icon-button svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
}

.search-box input {
  min-width: 0;
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 13px;
}

.search-box input::placeholder {
  color: #9aa1ad;
}

.search-box kbd {
  padding: 2px 5px;
  border: 1px solid var(--border);
  border-bottom-color: #cbd0d8;
  border-radius: 5px;
  background: #fafbfc;
  color: #8a919e;
  font-family: inherit;
  font-size: 10px;
}

.nav-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px 9px;
  color: #737b88;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.doc-count {
  display: grid;
  min-width: 23px;
  height: 20px;
  place-items: center;
  border-radius: 10px;
  background: #e7eaf0;
  color: #626a77;
  font-size: 11px;
  letter-spacing: 0;
}

.doc-nav {
  min-height: 0;
  flex: 1;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 0 10px 16px;
  scrollbar-color: #cbd0d8 transparent;
  scrollbar-width: thin;
}

.nav-item {
  position: relative;
  display: grid;
  grid-template-columns: 29px minmax(0, 1fr);
  align-items: center;
  width: 100%;
  min-height: 44px;
  margin: 1px 0;
  padding: 6px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #4a515d;
  cursor: pointer;
  text-align: left;
  transition: background 120ms ease, color 120ms ease;
}

.nav-item:hover {
  background: #eef0f4;
  color: var(--text);
}

.nav-item.active {
  background: var(--accent-soft);
  color: #164fae;
}

.nav-item.active::before {
  position: absolute;
  top: 9px;
  bottom: 9px;
  left: -10px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--accent);
  content: "";
}

.nav-number {
  color: #89919e;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
}

.nav-item.active .nav-number {
  color: var(--accent);
}

.nav-label {
  overflow: hidden;
  font-size: 13px;
  font-weight: 540;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-empty {
  padding: 20px 12px;
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
}

.sidebar-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 22px;
  border-top: 1px solid var(--border);
  color: #7b8390;
  font-size: 11px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #27a568;
  box-shadow: 0 0 0 3px rgba(39, 165, 104, 0.11);
}

.sidebar-scrim {
  display: none;
}

.main-panel {
  position: relative;
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
  background: white;
}

.reading-progress {
  position: absolute;
  z-index: 12;
  top: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--accent);
  transition: width 80ms linear;
}

.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  min-height: var(--topbar-height);
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
}

.crumbs {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 7px;
  color: var(--text-muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px;
}

.crumbs span:last-child {
  overflow: hidden;
  color: #3f4650;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.crumbs svg {
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.5;
}

.topbar-actions {
  flex: 0 0 auto;
}

.text-button,
.icon-button,
.retry-button {
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

.text-button {
  display: flex;
  height: 34px;
  align-items: center;
  gap: 7px;
  padding: 0 11px;
  color: #555d69;
  font-size: 12px;
}

.text-button:hover,
.icon-button:hover,
.retry-button:hover {
  border-color: #b9c0cb;
  background: #f8f9fb;
}

.menu-button {
  display: none;
  width: 36px;
  height: 36px;
  place-items: center;
}

.document-scroll {
  min-height: 0;
  flex: 1;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-behavior: smooth;
  scrollbar-color: #cbd0d8 transparent;
  scrollbar-width: thin;
}

.markdown-body {
  width: min(100%, 970px);
  margin: 0 auto;
  padding: 64px 48px 112px;
  color: #24292f;
  font-size: 16px;
  line-height: 1.78;
  overflow-wrap: break-word;
}

.markdown-body > :first-child {
  margin-top: 0 !important;
}

.markdown-body > :last-child {
  margin-bottom: 0 !important;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  position: relative;
  color: #161a20;
  font-weight: 720;
  line-height: 1.3;
  scroll-margin-top: 24px;
}

.markdown-body h1 {
  margin: 0 0 36px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--border);
  font-size: clamp(32px, 4vw, 45px);
  letter-spacing: -0.035em;
}

.markdown-body h2 {
  margin: 54px 0 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e7e9ed;
  font-size: 27px;
  letter-spacing: -0.02em;
}

.markdown-body h3 {
  margin: 38px 0 14px;
  font-size: 21px;
}

.markdown-body h4 {
  margin: 30px 0 12px;
  font-size: 17px;
}

.markdown-body p,
.markdown-body ul,
.markdown-body ol,
.markdown-body blockquote,
.markdown-body table,
.markdown-body pre {
  margin-top: 0;
  margin-bottom: 20px;
}

.markdown-body ul,
.markdown-body ol {
  padding-left: 1.55em;
}

.markdown-body li + li {
  margin-top: 7px;
}

.markdown-body a {
  color: #1e5fce;
  text-decoration: none;
}

.markdown-body a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.markdown-body strong {
  color: #15191f;
  font-weight: 700;
}

.markdown-body blockquote {
  padding: 14px 18px;
  border-left: 4px solid #8cb1f5;
  border-radius: 0 8px 8px 0;
  background: #f5f8fe;
  color: #4d5663;
}

.markdown-body blockquote > :last-child {
  margin-bottom: 0;
}

.markdown-body hr {
  height: 1px;
  margin: 42px 0;
  border: 0;
  background: var(--border);
}

.markdown-body :not(pre) > code {
  padding: 0.18em 0.42em;
  border: 1px solid #e1e5eb;
  border-radius: 5px;
  background: #f4f6f8;
  color: #b4234d;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.88em;
}

.markdown-body pre {
  max-width: 100%;
  padding: 21px 23px;
  overflow: auto;
  border: 1px solid #263348;
  border-radius: 10px;
  background: var(--code-bg);
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
  color: var(--code-text);
  line-height: 1.62;
  tab-size: 4;
}

.markdown-body pre code {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 13px;
  white-space: pre;
}

.markdown-body .table-wrap {
  max-width: 100%;
  margin: 0 0 24px;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 9px;
}

.markdown-body table {
  width: 100%;
  margin: 0;
  border-collapse: collapse;
  font-size: 14px;
  line-height: 1.55;
}

.markdown-body th,
.markdown-body td {
  padding: 11px 14px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}

.markdown-body th:last-child,
.markdown-body td:last-child {
  border-right: 0;
}

.markdown-body tr:last-child td {
  border-bottom: 0;
}

.markdown-body th {
  background: #f6f7f9;
  color: #343b45;
  font-weight: 680;
}

.markdown-body tbody tr:nth-child(even) {
  background: #fafbfc;
}

.markdown-body img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 26px auto;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fbfcfe;
}

.loading-state,
.error-state {
  display: flex;
  min-height: calc(100vh - var(--topbar-height));
  align-items: center;
  justify-content: center;
}

.loading-state {
  gap: 11px;
  color: var(--text-muted);
  font-size: 13px;
}

.loader {
  width: 17px;
  height: 17px;
  border: 2px solid #d9deea;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 700ms linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.error-state {
  flex-direction: column;
  padding: 40px;
  text-align: center;
}

.error-state h1 {
  margin: 0 0 8px;
  font-size: 22px;
}

.error-state p {
  max-width: 560px;
  margin: 0 0 20px;
  color: var(--text-muted);
  font-size: 13px;
}

.retry-button {
  height: 36px;
  padding: 0 14px;
  font-size: 13px;
}

.toast {
  position: fixed;
  z-index: 50;
  right: 24px;
  bottom: 24px;
  padding: 10px 14px;
  border-radius: 8px;
  background: #20252c;
  color: white;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 150ms ease, transform 150ms ease;
}

.toast.visible {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 820px) {
  .app-shell {
    display: block;
  }

  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: min(86vw, var(--sidebar-width));
    box-shadow: 18px 0 50px rgba(23, 31, 43, 0.16);
    transform: translateX(-105%);
    transition: none;
  }

  body.sidebar-open .sidebar {
    transform: translateX(0);
  }

  .sidebar-scrim {
    position: fixed;
    z-index: 15;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: rgba(17, 24, 39, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: none;
  }

  body.sidebar-open .sidebar-scrim {
    opacity: 1;
    pointer-events: auto;
  }

  .main-panel {
    height: 100%;
  }

  .topbar {
    gap: 10px;
    padding: 0 14px;
  }

  .menu-button {
    display: grid;
    flex: 0 0 auto;
  }

  .crumbs {
    min-width: 0;
    flex: 1;
  }

  .markdown-body {
    padding: 42px 22px 82px;
    font-size: 15px;
    line-height: 1.72;
  }

  .markdown-body h1 {
    margin-bottom: 28px;
    padding-bottom: 17px;
    font-size: 30px;
  }

  .markdown-body h2 {
    margin-top: 42px;
    font-size: 23px;
  }

  .markdown-body pre {
    margin-right: -6px;
    margin-left: -6px;
    padding: 17px;
    border-radius: 8px;
  }
}

@media (max-width: 520px) {
  .text-button span {
    display: none;
  }

  .text-button {
    width: 36px;
    justify-content: center;
    padding: 0;
  }

  .crumbs > span:first-child,
  .crumbs > svg {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

</style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="文档导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M8 8.5h16v15H8z" />
              <path d="M12 5.5h8M12 26.5h8M5 12.5v7M27 12.5v7" />
            </svg>
          </div>
          <div>
            <div class="brand-title">Agent Blueprint</div>
            <div class="brand-subtitle">组件参考文档</div>
          </div>
        </div>

        <label class="search-box" for="doc-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m16 16 4 4" />
          </svg>
          <input id="doc-search" type="search" placeholder="查找文档" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>

        <div class="nav-heading">
          <span>组件文档</span>
          <span class="doc-count" id="doc-count">17</span>
        </div>
        <nav class="doc-nav" id="doc-nav"></nav>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span>原文实时读取</span>
        </div>
      </aside>

      <button class="sidebar-scrim" id="sidebar-scrim" aria-label="关闭导航"></button>

      <main class="main-panel">
        <div class="reading-progress" id="reading-progress"></div>
        <header class="topbar">
          <button class="icon-button menu-button" id="menu-button" aria-label="打开导航">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <div class="crumbs" aria-label="当前位置">
            <span>agent-blueprint</span>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3.5 4 4.5-4 4.5" /></svg>
            <span id="current-file">README.md</span>
          </div>
          <div class="topbar-actions">
            <button class="text-button" id="copy-link" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 15 15 9M7.5 12.5l-2 2a3.5 3.5 0 1 0 5 5l2-2M16.5 11.5l2-2a3.5 3.5 0 1 0-5-5l-2 2" />
              </svg>
              <span>复制链接</span>
            </button>
          </div>
        </header>

        <div class="document-scroll" id="document-scroll">
          <div class="loading-state" id="loading-state" role="status">
            <span class="loader" aria-hidden="true"></span>
            <span>正在读取原文…</span>
          </div>
          <article class="markdown-body" id="document" hidden></article>
          <div class="error-state" id="error-state" hidden>
            <h1>文档暂时无法读取</h1>
            <p id="error-message"></p>
            <button class="retry-button" id="retry-button" type="button">重新加载</button>
          </div>
        </div>
      </main>
    </div>

const payloadStream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
const payload = await new Response(payloadStream).json();
window.__STATIC_DOCS__ = payload.docs;
window.__STATIC_ASSETS__ = payload.assets;
const nav = document.querySelector("#doc-nav");
const count = document.querySelector("#doc-count");
const search = document.querySelector("#doc-search");
const documentView = document.querySelector("#document");
const documentScroll = document.querySelector("#document-scroll");
const loadingState = document.querySelector("#loading-state");
const errorState = document.querySelector("#error-state");
const errorMessage = document.querySelector("#error-message");
const currentFile = document.querySelector("#current-file");
const progress = document.querySelector("#reading-progress");
const menuButton = document.querySelector("#menu-button");
const sidebarScrim = document.querySelector("#sidebar-scrim");
const copyLinkButton = document.querySelector("#copy-link");
const retryButton = document.querySelector("#retry-button");
const toast = document.querySelector("#toast");

const state = {
  docs: [],
  activeId: "",
  activeMarkdown: "",
  requestId: 0,
};

function chapterNumber(id) {
  return id.slice(1, 3);
}

function cleanTitle(title) {
  return title.replace(/^s\d{2}:\s*/i, "");
}

function slugify(text, index) {
  const slug = text
    .trim()
    .toLowerCase()
    .replace(/<[^>]+>/g, "")
    .replace(/[\s/]+/g, "-")
    .replace(/[^\w\u3400-\u9fff-]/g, "")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
  return slug || `section-${index + 1}`;
}

function currentId() {
  const id = decodeURIComponent(location.hash.slice(1)).split("/")[0];
  return state.docs.some((doc) => doc.id === id) ? id : state.docs[0]?.id;
}

function renderNav(query = "") {
  const normalized = query.trim().toLocaleLowerCase("zh-CN");
  const visibleDocs = state.docs.filter((doc) => {
    const haystack = `${doc.id} ${doc.title}`.toLocaleLowerCase("zh-CN");
    return !normalized || haystack.includes(normalized);
  });

  nav.replaceChildren();
  count.textContent = String(visibleDocs.length);

  if (!visibleDocs.length) {
    const empty = document.createElement("div");
    empty.className = "nav-empty";
    empty.textContent = "没有匹配的文档";
    nav.append(empty);
    return;
  }

  const fragment = document.createDocumentFragment();
  for (const doc of visibleDocs) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `nav-item${doc.id === state.activeId ? " active" : ""}`;
    button.dataset.docId = doc.id;
    button.setAttribute("aria-current", doc.id === state.activeId ? "page" : "false");

    const number = document.createElement("span");
    number.className = "nav-number";
    number.textContent = chapterNumber(doc.id);

    const label = document.createElement("span");
    label.className = "nav-label";
    label.textContent = cleanTitle(doc.title);
    label.title = doc.title;

    button.append(number, label);
    button.addEventListener("click", () => {
      if (location.hash !== `#${doc.id}`) location.hash = doc.id;
      else loadDocument(doc.id);
      document.body.classList.remove("sidebar-open");
    });
    fragment.append(button);
  }
  nav.append(fragment);
}

function routeRelativeResources(id) {
  for (const image of documentView.querySelectorAll("img[src]")) {
    const raw = image.getAttribute("src");
    if (raw && !/^(?:[a-z]+:|\/|#)/i.test(raw)) {
      const normalized = raw.replace(/^\.\//, "");
      const embedded = window.__STATIC_ASSETS__?.[`${id}/${normalized}`];
      image.src = embedded || new URL(`./docs/${id}/${normalized}`, document.baseURI).href;
    }
  }

  for (const link of documentView.querySelectorAll("a[href]")) {
    const raw = link.getAttribute("href") || "";
    const chapterMatch = raw.match(/(?:^|\.\.\/)(s\d{2}_[a-z0-9_]+)(?:\/|\/README\.md)?(?:#.*)?$/i);
    if (chapterMatch && state.docs.some((doc) => doc.id === chapterMatch[1])) {
      link.href = `#${chapterMatch[1]}`;
      continue;
    }
    if (!/^(?:[a-z]+:|\/|#)/i.test(raw)) {
      link.href = new URL(`./docs/${id}/${raw.replace(/^\.\//, "")}`, document.baseURI).href;
      link.target = "_blank";
      link.rel = "noreferrer";
    }
  }
}

function improveDocumentLayout() {
  const headings = [...documentView.querySelectorAll("h1, h2, h3, h4, h5, h6")];
  const used = new Map();
  headings.forEach((heading, index) => {
    const base = slugify(heading.textContent || "", index);
    const seen = used.get(base) || 0;
    used.set(base, seen + 1);
    heading.id = seen ? `${base}-${seen + 1}` : base;
  });

  for (const table of documentView.querySelectorAll("table")) {
    if (table.parentElement?.classList.contains("table-wrap")) continue;
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    table.parentNode.insertBefore(wrap, table);
    wrap.append(table);
  }
}

function showLoading() {
  loadingState.hidden = false;
  documentView.hidden = true;
  errorState.hidden = true;
}

function showError(error) {
  loadingState.hidden = true;
  documentView.hidden = true;
  errorState.hidden = false;
  errorMessage.textContent = error?.message || "未知错误";
}

async function loadDocument(id) {
  if (!id) return;
  const requestId = ++state.requestId;
  state.activeId = id;
  renderNav(search.value);
  showLoading();
  documentScroll.scrollTop = 0;
  progress.style.width = "0%";
  currentFile.textContent = `${id}/README.md`;

  try {
    const doc = state.docs.find((item) => item.id === id);
    if (!doc) throw new Error("未找到对应文档");
    if (requestId !== state.requestId) return;

    state.activeMarkdown = doc.markdown;
    documentView.innerHTML = doc.html;
    routeRelativeResources(id);
    improveDocumentLayout();
    document.title = `${doc.title}｜Agent Blueprint`;
    loadingState.hidden = true;
    errorState.hidden = true;
    documentView.hidden = false;
    renderNav(search.value);

    window.__DOCS_PREVIEW__ = {
      count: state.docs.length,
      activeId: id,
      title: doc.title,
      markdown: doc.markdown,
    };
  } catch (error) {
    if (requestId === state.requestId) showError(error);
  }
}

function updateProgress() {
  const max = documentScroll.scrollHeight - documentScroll.clientHeight;
  const percent = max > 0 ? Math.min(100, (documentScroll.scrollTop / max) * 100) : 100;
  progress.style.width = `${percent}%`;
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("visible");
  window.setTimeout(() => toast.classList.remove("visible"), 1500);
}

async function copyCurrentLink() {
  try {
    await navigator.clipboard.writeText(location.href);
    showToast("链接已复制");
  } catch {
    showToast("请从地址栏复制链接");
  }
}

async function initialize() {
  try {
    if (Array.isArray(window.__STATIC_DOCS__)) {
      state.docs = window.__STATIC_DOCS__;
    } else {
      const response = await fetch(new URL("./data/docs.json", document.baseURI), { cache: "no-store" });
      if (!response.ok) throw new Error(`文档列表读取失败（HTTP ${response.status}）`);
      state.docs = await response.json();
    }
    renderNav();
    const id = currentId();
    if (!location.hash && id) history.replaceState(null, "", `#${id}`);
    await loadDocument(id);
  } catch (error) {
    showError(error);
  }
}

window.addEventListener("hashchange", () => loadDocument(currentId()));
documentScroll.addEventListener("scroll", updateProgress, { passive: true });
search.addEventListener("input", () => renderNav(search.value));
menuButton.addEventListener("click", () => document.body.classList.add("sidebar-open"));
sidebarScrim.addEventListener("click", () => document.body.classList.remove("sidebar-open"));
copyLinkButton.addEventListener("click", copyCurrentLink);
retryButton.addEventListener("click", () => loadDocument(state.activeId || currentId()));

document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    search.focus();
    search.select();
  }
  if (event.key === "Escape") {
    document.body.classList.remove("sidebar-open");
    if (document.activeElement === search) search.blur();
  }
});

initialize();

</script>
